<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Medieval Spheres - Base 44</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="mode-row">
  <button class="mtab active" onclick="setMode('1v1')">&#9884; 1v1</button>
  <button class="mtab" onclick="setMode('2v2')">&#9876; 2v2</button>
</div>
<div id="sel-row"></div>
<div id="card" class="mode-1v1">
  <div id="titlebar">
    <div id="title-text"><span id="t-red">-</span><span id="t-vs"> VS </span><span id="t-blue">-</span></div>
  </div>
  <div id="arena-outer">
    <div id="arena-border">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <canvas id="gc"></canvas>
      <div id="winner"><div id="wt">-</div><div id="ws">TAP TO REPLAY</div></div>
    </div>
  </div>
  <div id="abilitybar">
    <span class="abn r" id="abn-r">-</span>
    <div class="acd"><div class="acd-f" id="acd-r"></div></div>
    <div class="acd"><div class="acd-f" id="acd-b"></div></div>
    <span class="abn b" id="abn-b">-</span>
  </div>
  <div id="divider"></div>
  <div id="stats">
    <div class="sc">
      <div class="sn r" id="wn-r">-</div>
      <div class="sr">HP&nbsp;&nbsp; <span id="shp-r">-</span></div>
      <div class="sr">DMG&nbsp; <span id="sd-r">-</span></div>
      <div class="sr">ARM&nbsp; <span id="sa-r">-</span></div>
      <div class="sr">MDEF <span id="smd-r">-</span></div>
      <div class="sr">&omega;&nbsp;&nbsp;&nbsp;&nbsp; <span class="hl" id="so-r">-</span></div>
      <div class="sr">STKS <span id="sst-r">-</span></div>
    </div>
    <div class="sdiv"></div>
    <div class="sc">
      <div class="sn b" id="wn-b">-</div>
      <div class="sr">HP&nbsp;&nbsp; <span id="shp-b">-</span></div>
      <div class="sr">DMG&nbsp; <span id="sd-b">-</span></div>
      <div class="sr">ARM&nbsp; <span id="sa-b">-</span></div>
      <div class="sr">MDEF <span id="smd-b">-</span></div>
      <div class="sr">&omega;&nbsp;&nbsp;&nbsp;&nbsp; <span class="hl" id="so-b">-</span></div>
      <div class="sr">STKS <span id="sst-b">-</span></div>
    </div>
  </div>
</div>
<div id="controls">
  <button class="pbtn" id="pbtn" onclick="togglePause()">PAUSE</button>
  <button class="pbtn new" onclick="window.startPicker(gameMode)">REPICK</button>
  <button class="pbtn balance" id="balance-btn" onclick="startBalanceBaselineButton()">BALANCE TEST</button>
  <span id="balance-status">idle</span>
  <div id="audio-panel">
    <button class="pbtn audio" id="mute-btn" onclick="toggleAudioMute()">SOUND ON</button>
    <label class="avol">SFX <input id="sfx-vol" type="range" min="0" max="100" value="85" oninput="setAudioVolume('sfx', this.value)"></label>
    <label class="avol">BGM <input id="bgm-vol" type="range" min="0" max="100" value="45" oninput="setAudioVolume('bgm', this.value)"></label>
  </div>
</div>

<!--
  SCRIPT LOAD ORDER - classic scripts share the same global scope, and each
  file depends on symbols loaded above it. Keep this order when editing the
  no-build, file:// friendly runtime.

  1. core/*              - Shared constants and canvas helpers.
  2. data/*              - DEF, class metadata, stack thresholds, and audio config.
  3. weapons/*           - Grouped weapon render maps, then WEAPONS reconstruction.
  4. entities/*          - Projectile, zone/trap, companion, shared entity, and Sphere classes.
  5. combat/audio/hud/loop - Effects, audio subsystem, collision resolution, HUD, and loop.
  6. ui/*                - Picker styles, start screen, picker flow, battle reports, testing ground, and battle launch/countdown.
  7. main.js             - Canvas/ctx setup, global mutable arrays, battle creation, resize,
                           and window.onload -> showStartScreen.
-->
<script src="js/core/constants.js"></script>
<script src="js/core/rrect.js"></script>
<script src="js/data/classDefs.js"></script>
<script src="js/data/classMeta.js"></script>
<script src="js/data/classStacks.js"></script>
<script src="js/data/audioConfig.js"></script>
<script src="js/data/stallConfig.js"></script>
<script src="js/weapons/weapons-melee.js"></script>
<script src="js/weapons/weapons-ranged.js"></script>
<script src="js/weapons/weapons-exotic.js"></script>
<script src="js/weapons/weapons-index.js"></script>
<script src="js/entities/projectiles-basic.js"></script>
<script src="js/entities/projectiles-roster.js"></script>
<script src="js/entities/projectiles-shared.js"></script>
<script src="js/entities/zones-and-traps.js"></script>
<script src="js/entities/companions.js"></script>
<script src="js/entities/sphere.js"></script>
<script src="js/combat/particles-fx.js"></script>
<script src="js/audio/audio-engine.js"></script>
<script src="js/combat/collisions.js"></script>
<script src="js/hud/hud.js"></script>
<script src="js/loop/stall-resolution.js"></script>
<script src="js/loop/game-loop.js"></script>
<script src="js/ui/picker-styles.js"></script>
<script src="js/ui/start-screen.js"></script>
<script src="js/ui/picker-screen.js"></script>
<script src="js/ui/battle-report.js"></script>
<script src="js/ui/testing-ground.js"></script>
<script src="js/ui/battle-launch.js"></script>
<script src="js/main.js"></script>
<script src="js/balance/CombatTracker.js"></script>
<script src="js/tools/balance-runner.js"></script>
</body>
</html>
