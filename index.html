<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Medieval Spheres - Base 44</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="mode-row">
  <button class="mtab active" onclick="setMode('1v1')">&#9884; 1v1</button>
  <button class="mtab" onclick="setMode('2v2')">&#9876; 2v2</button>
</div>
<div id="sel-row"></div>
<div id="card" class="mode-1v1">
  <div id="titlebar">
    <div id="title-text"><span id="t-red">-</span><span id="t-vs"> VS </span><span id="t-blue">-</span></div>
  </div>
  <div id="arena-outer">
    <div id="arena-border">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <canvas id="gc"></canvas>
      <div id="winner"><div id="wt">-</div><div id="ws">TAP TO REPLAY</div></div>
    </div>
  </div>
  <div id="divider"></div>
  <div id="stats" aria-live="polite"></div>
</div>
<div id="controls">
  <button class="pbtn" id="pbtn" onclick="togglePause()">PAUSE</button>
  <button class="pbtn new" onclick="window.startPicker(gameMode)">REPICK</button>
  <button class="pbtn balance" id="balance-btn" onclick="startBalanceBaselineButton()">BALANCE TEST</button>
  <span id="balance-status">idle</span>
  <div id="audio-panel">
    <button class="pbtn audio" id="mute-btn" onclick="toggleAudioMute()">SOUND ON</button>
    <label class="avol">SFX <input id="sfx-vol" type="range" min="0" max="100" value="85" oninput="setAudioVolume('sfx', this.value)"></label>
    <label class="avol">BGM <input id="bgm-vol" type="range" min="0" max="100" value="45" oninput="setAudioVolume('bgm', this.value)"></label>
  </div>
</div>

<!--
  SCRIPT LOAD ORDER - classic scripts share the same global scope, and each
  file depends on symbols loaded above it. Keep this order when editing the
  no-build, file:// friendly runtime.

  1. core/*              - Shared constants, canvas helpers, and class registries.
  2. classes/*           - One classic script per sphere class populating DEF/metadata/audio registries.
  3. data/*              - Arena audio and stall config.
  4. weapons/*           - Grouped weapon render maps, then WEAPONS reconstruction.
  5. entities/*          - Projectile, zone/trap, companion, shared entity, and Sphere classes.
  6. combat/audio/hud/loop - Effects, audio subsystem, collision resolution, HUD, and loop.
  7. ui/*                - Picker styles, start screen, picker flow, battle reports, testing ground, and battle launch/countdown.
  8. main.js             - Canvas/ctx setup, global mutable arrays, battle creation, resize,
                           and window.onload -> showStartScreen.
-->
